name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-log
          path: build.log

      - name: Publish build log summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Android build failure"
            echo '```text'
            tail -120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit build log for debugging
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          cp build.log ci-logs/latest-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/latest-build.log
          git commit -m "Update Android build log [skip ci]" || exit 0
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: sales-ai-companion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
